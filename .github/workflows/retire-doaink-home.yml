name: Retire only doaink-home once

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'CHECK_ONLY first; permanent deletion targets only doaink-home'
        required: true
        default: CHECK_ONLY
        type: choice
        options:
          - CHECK_ONLY
          - DELETE_DOAINK_HOME_PERMANENTLY
      expected_commit:
        description: 'Full reviewed main SHA containing this one-time workflow'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ztd-homepage-deploy
  cancel-in-progress: false

jobs:
  retirement:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Require the exact reviewed main commit
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          assert.equal(process.env.GITHUB_REPOSITORY, 'zeithrold/website');
          assert.equal(process.env.GITHUB_REF, 'refs/heads/main');
          assert.match(process.env.EXPECTED_COMMIT ?? '', /^[a-f0-9]{40}$/);
          assert.equal(process.env.EXPECTED_COMMIT, process.env.GITHUB_SHA);
          NODE
      - name: Inspect dependencies and optionally delete only the old Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RETIRE_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/retire-doaink-home.mjs
