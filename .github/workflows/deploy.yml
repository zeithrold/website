name: Deploy Worker manually

# No push, PR, workflow_run, or schedule trigger. One coordinator owns the cutover.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'After Mac DNS handoff, type DEPLOY_ZTD_ME_AND_ALIASES (five approved hosts)'
        required: true
        type: string
      expected_commit:
        description: 'Full reviewed main SHA after this phase PR is merged'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ztd-homepage-deploy
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the dispatched commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Require the exact approved release
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
          DEPLOY_ENABLED: ${{ vars.WEBSITE_DEPLOY_ENABLED }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/check-release.mjs

  verify:
    needs: authorize
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: verify
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download the tested Worker
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: worker-${{ github.sha }}
          path: dist/
      - name: Verify exactly the five approved hosts and no addons
        run: pnpm check:build
      - name: Check existing Custom Domain ownership without changing it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/check-cloudflare-target.mjs
      - name: Deploy the tested Worker and built-in assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The existing CLOUDFLARE_API_TOKEN secret is required."
            exit 1
          fi
          if [[ "$CLOUDFLARE_ACCOUNT_ID" != "a0df2e968b524bdd77c0eab565058522" ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must match the approved account."
            exit 1
          fi
          pnpm run deploy
      - name: Verify all five approved domain owners
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/check-cloudflare-target.mjs --after
