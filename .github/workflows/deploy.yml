name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Replace stale PR checks, but never interrupt an active main deployment.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout the workflow commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check generated binding types
        run: |
          pnpm types
          git diff --exit-code -- worker-configuration.d.ts
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build Worker
        run: pnpm build
      - name: Verify build and deployment boundaries
        run: pnpm check:build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify production Worker locally
        run: pnpm test:e2e
      - name: Recheck the deploy config after local emulation
        run: pnpm check:build
      - name: Upload verified build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worker-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Deploy
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'zeithrold/website'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout the workflow commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download the tested Worker
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: worker-${{ github.sha }}
          path: dist/
      - name: Verify build and deployment boundaries
        run: pnpm check:build
      - name: Require a main push to the existing account
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/check-release.mjs
      - name: Verify all five existing Custom Domain owners
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/check-cloudflare-target.mjs
      - name: Deploy the tested Worker and built-in assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json --tag "$GITHUB_SHA"
      - name: Verify all five existing Custom Domain owners after deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/check-cloudflare-target.mjs
