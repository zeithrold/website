name: Deploy Worker manually

# No push, PR, workflow_run, or schedule trigger. Never dispatch in the review phase.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'After approval, type DEPLOY_WORKER_ONLY (does not attach domains)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ztd-homepage-deploy
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && vars.WEBSITE_DEPLOY_ENABLED == 'true' && inputs.confirmation == 'DEPLOY_WORKER_ONLY'
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && vars.WEBSITE_DEPLOY_ENABLED == 'true' && inputs.confirmation == 'DEPLOY_WORKER_ONLY'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download the tested Worker
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: worker-${{ github.sha }}
          path: dist/
      - name: Verify no domain attachment or addons
        run: pnpm check:build
      - name: Deploy the tested Worker and built-in assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The existing CLOUDFLARE_API_TOKEN secret is required."
            exit 1
          fi
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::Set the confirmed public account ID in CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          pnpm run deploy
