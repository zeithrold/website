name: Checks

on:
  push:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check generated binding types
        run: |
          pnpm types
          git diff --exit-code -- worker-configuration.d.ts
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build Worker
        run: pnpm build
      - name: Verify build and deployment boundaries
        run: pnpm check:build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify production Worker locally
        run: pnpm test:e2e
      - name: Upload verified build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worker-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
